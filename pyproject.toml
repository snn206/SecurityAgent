[project]
name = "security-agent"
version = "0.1.0"
description = "Modular Multi-Agent security research system built on LangGraph and Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SecurityAgent Team" }]
keywords = ["security", "agents", "langgraph", "pentest", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

dependencies = [
    # LangChain / LangGraph
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-mistralai>=0.2",
    "langchain-community>=0.3",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "sse-starlette>=2",
    "httpx>=0.27",

    # Data / Config
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "python-dotenv>=1",
    "jsonschema>=4",

    # Database (execution history & embedded document memory)
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.20",
    "tinydb>=4.8",

    # Reports
    "jinja2>=3",
    "markdown>=3",
    "weasyprint>=62",

    # Docker SDK
    "docker>=7",

    # Utilities
    "tenacity>=9",
    "structlog>=24",
    "rich>=13",
    "typer>=0.12",
    "anyio>=4",
]

[project.urls]
Repository = "https://github.com/snn206/SecurityAgent"
Changelog = "https://github.com/snn206/SecurityAgent/blob/main/CHANGELOG.md"

[project.scripts]
security-agent = "security_agent.api.app:main"
sa-update = "security_agent.versioning.cli:main"


[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3"]
pdf = ["weasyprint>=62"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3",
    "types-pyyaml>=6",
    "coverage[toml]>=7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_agent"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "security_agent/registry"
"config" = "security_agent/config"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E741", "UP042", "B904", "B007", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "override",
    "attr-defined",
    "arg-type",
    "call-arg",
    "union-attr",
    "return-value",
    "call-overload",
    "syntax",
    "assignment",
]
exclude = ["tests/", "scripts/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/security_agent"]
omit = ["*/tests/*", "*/ui/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
