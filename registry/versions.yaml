# ─── Tools ────────────────────────────────────────────────────────────────────
tools:
  nmap:
    version: "7.95"
    artifact: docker-tag
    install_cmd: "apt-get install -y nmap"
    changelog: "registry/changelog/tools/nmap.md"

  gobuster:
    version: "3.6.0"
    artifact: docker-tag
    install_cmd: "apt-get install -y gobuster"
    changelog: "registry/changelog/tools/gobuster.md"

  sqlmap:
    version: "1.8"
    artifact: docker-tag
    install_cmd: "apt-get install -y sqlmap"
    changelog: "registry/changelog/tools/sqlmap.md"

  nikto:
    version: "2.1.6"
    artifact: docker-tag
    install_cmd: "apt-get install -y nikto"
    changelog: "registry/changelog/tools/nikto.md"

  whois:
    version: "5.5.23"
    artifact: docker-tag
    install_cmd: "apt-get install -y whois"
    changelog: "registry/changelog/tools/whois.md"

  curl:
    version: "8.9"
    artifact: docker-tag
    install_cmd: "apt-get install -y curl"
    changelog: "registry/changelog/tools/curl.md"

# ─── Packages (optional installable Python packages) ─────────────────────────
packages: {}

# ─── Extensions ───────────────────────────────────────────────────────────────
extensions: {}
