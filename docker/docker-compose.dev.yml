# Development overrides — mounts source for hot reload
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    volumes:
      - ../src:/app/src
    environment:
      - SA_DEBUG=true
      - SA_LOG_LEVEL=DEBUG
    command: ["uvicorn", "security_agent.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080", "--reload"]
